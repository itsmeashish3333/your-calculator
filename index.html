  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <style>
        /* बेसिक डिज़ाइन */
        .calculator { width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        #display { width: 93%; height: 40px; text-align: right; margin-bottom: 20px; font-size: 20px; padding: 5px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 18px; cursor: pointer; border-radius: 5px; border: 1px solid #ddd; }
        button:hover { background-color: #f0f0f0; }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- डिस्प्ले स्क्रीन -->
        <input type="text" id="display" readonly>
        
        <!-- बटन्स -->
        <div class="buttons">
            <button onclick="clearDisplay()">C</button> <!-- सब साफ़ करने के लिए -->
            <button onclick="deleteLast()">DEL</button> <!-- एक नंबर हटाने के लिए -->
            <button onclick="appendToDisplay('/')">/</button>
            <button onclick="appendToDisplay('*')">*</button>
            
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')">-</button>
            
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('+')">+</button>
            
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="calculateResult()">=</button>
            
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        // स्क्रीन पर नंबर जोड़ने के लिए
        function appendToDisplay(input) {
            display.value += input;
        }

        // पूरी स्क्रीन साफ़ (Clear) करने के लिए
        function clearDisplay() {
            display.value = "";
        }

        // सिंगल नंबर (Backspace) हटाने के लिए
        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        // हिसाब लगाने के लिए
        function calculateResult() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Error";
            }
        }
    </script>
</body>
</html>


  <script>
    const display = document.getElementById("display");

function appendToDisplay(input) {
    display.value += input;
}

function clearDisplay() {
    display.value = "";
}

function deleteLast() {
    display.value = display.value.slice(0, -1);
}

function calculateResult() {
    try {
        display.value = eval(display.value);
    } catch (error) {
        display.value = "Error";
    }
}

  </script>
</body>
